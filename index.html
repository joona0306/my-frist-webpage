<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>대한민국 구석구석 클론코딩</title>

    <!-- Pretendard CDN -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <!-- 외부 스타일시트 연결 -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="wrap">
      <header class="header">
        <div class="inner">
          <a href="#" class="logo">
            대한민국 구석구석 바로가기
            <img
              src="assets/images/logo_homelink_bk.png"
              alt="대한민국 구석구석 바로가기"
            />
          </a>
          <nav class="nav">
            <ul class="menu-list">
              <li><a href="#" class="home">축제 메인</a></li>
              <li><a href="#">문화관광축제</a></li>
              <li><a href="#">전국축제</a></li>
              <li><a href="#">축제달력</a></li>
              <li><a href="#">테마</a></li>
            </ul>

            <div class="nav-utils">
              <div class="nav-pick">
                <button class="main-pick" aria-label="찜하기 버튼">
                  <img
                    src="assets/icons/icon_pick_off.png"
                    alt="찜하기 버튼 아이콘"
                  />
                </button>
                <div class="main-pick-bubble"></div>
              </div>
              <button class="main-search" aria-label="검색 버튼"></button>
            </div>
          </nav>
        </div>
      </header>
      <main class="main">
        <section class="hero">
          <div class="main-visual">
            <!-- 슬라이드 영역 배경 -->
            <div class="main-visual-bg"></div>

            <!-- 슬라이드 영역 -->
            <div class="visual-inner">
              <!-- Swiper 라이브러리로 대체 -->

              <button class="prev-btn">
                <img src="assets/images/pre_on_btn.png" alt="이전 버튼" />
                <img
                  class="off"
                  src="assets/images/btn_pre_off.png"
                  alt="이전 버튼"
                />
              </button>

              <div class="swiper-container">
                <div class="swiper-slide">
                  <a href="#">
                    <div class="slide-image">
                      <img
                        src="assets/images/slide_3.jpg"
                        alt="무주반딧불축제 포스터"
                      />
                    </div>
                    <div class="info-box">
                      <div class="slide-title">
                        <div class="sort">
                          <span class="bage">추천축제</span>
                        </div>
                        <div class="location">
                          <img
                            src="assets/icons/icon_location.png"
                            alt="장소 아이콘"
                          />
                          <span>전북특별자치도 무주군</span>
                        </div>
                        <h2 class="slide-title-head">무주반딧불축제</h2>
                      </div>
                      <div class="main-schedule"></div>
                      <ul class="explain">
                        <li></li>
                        <li></li>
                      </ul>
                    </div>
                  </a>
                </div>
              </div>

              <button class="next-btn">
                <img src="assets/images/next_on_btn.png" alt="다음 버튼" />
                <img
                  class="on"
                  src="assets/images/btn_next_off.png"
                  alt="다음 버튼"
                />
              </button>
            </div>
          </div>
        </section>
        <section class="keywords">
          <div class="inner">축제 키워드 영역</div>
        </section>
        <section class="rank">
          <div class="inner">사람들이 많이 본 축제 영역</div>
        </section>
        <section class="festival">
          <div class="inner">지역 축제 슬라이드 영역</div>
        </section>
        <section class="alio">
          <div class="inner">먹거리 알리오 영역</div>
        </section>
        <section class="banner">
          <div class="inner">배너 슬라이드 영역</div>
        </section>
        <section class="theme">
          <div class="inner">테마 축제 영역</div>
        </section>
      </main>
      <footer class="footer">
        <div class="inner">푸터영역</div>
      </footer>
    </div>
  </body>
</html>
