<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iframe 태그</title>

    <!-- 내부 스타일시트 -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <!-- 유튜브 영상 -->
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/IjqNGfI56iw?si=XdO1BInxbuFqagJ3"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <iframe src="https://www.naver.com" frameborder="0"></iframe>

    <!-- 구글 드라이브 영상 -->
    <iframe
      src="https://drive.google.com/file/d/1BRqVLkRHlzGZzm3ZMSL_f2Jj61rA-tV4/preview"
      width="640"
      height="360"
      allow="autoplay"
      allowfullscreen
    ></iframe>
  </body>
</html>
